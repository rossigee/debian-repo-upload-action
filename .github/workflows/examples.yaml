name: Example Workflows (Reference)

# This file is not executed - it's here as documentation showing how to use
# the debian-repo-upload-action in different scenarios.
#
# Copy and adapt these examples to your project's workflow files.

# Example 1: Simple release workflow
# .github/workflows/release.yaml
example_simple_release:
  name: Build and Release
  on:
    push:
      tags:
        - 'v*'
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build Debian package
          run: |
            # Your build commands here
            dpkg-buildpackage -us -uc

        - name: Upload to debian-repo
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: stable
            component: main

# Example 2: Matrix build for multiple architectures
# .github/workflows/release.yaml
example_matrix_build:
  name: Build and Release (Multi-Arch)
  on:
    push:
      tags:
        - 'v*'
  jobs:
    build:
      strategy:
        matrix:
          arch: [amd64, arm64]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build Debian package (${{ matrix.arch }})
          run: |
            # Cross-compile or use native build
            dpkg-buildpackage -a${{ matrix.arch }} -us -uc

        - name: Upload to debian-repo
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*_${{ matrix.arch }}.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: stable
            component: main

# Example 3: Conditional uploads (only on release, not pull requests)
# .github/workflows/ci.yaml
example_conditional_upload:
  name: CI with Conditional Upload
  on:
    push:
      branches:
        - main
        - develop
      tags:
        - 'v*'
    pull_request:
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build Debian package
          run: dpkg-buildpackage -us -uc

        - name: Upload to debian-repo (releases only)
          if: startsWith(github.ref, 'refs/tags/v')
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: stable
            component: main

        - name: Upload to testing (develop branch)
          if: github.ref == 'refs/heads/develop'
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: testing
            component: main

# Example 4: Using outputs from the action
# .github/workflows/release.yaml
example_using_outputs:
  name: Build, Upload, and Create Release
  on:
    push:
      tags:
        - 'v*'
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build Debian package
          run: dpkg-buildpackage -us -uc

        - name: Upload to debian-repo
          id: upload
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: stable
            component: main

        - name: Create GitHub Release
          uses: ncipollo/release-action@v1
          with:
            tag: ${{ github.ref }}
            body: |
              **Debian Repository Upload Summary**
              - **Package**: ${{ steps.upload.outputs.package }}
              - **Version**: ${{ steps.upload.outputs.version }}
              - **Architecture**: ${{ steps.upload.outputs.architecture }}
              - **Location**: ${{ steps.upload.outputs.filename }}
              - **SHA256**: `${{ steps.upload.outputs.sha256 }}`

# Example 5: Multi-suite promotion workflow
# Publish to unstable, then promote to testing/stable after validation
# .github/workflows/release.yaml
example_multi_suite_promotion:
  name: Build and Promote Through Suites
  on:
    push:
      tags:
        - 'v*'
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build Debian package
          run: dpkg-buildpackage -us -uc

        - name: Upload to unstable (for early testing)
          id: upload_unstable
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: unstable
            component: main

        - name: Wait for manual approval
          run: |
            echo "Package uploaded to unstable suite"
            echo "Review at: https://debs.example.com/"
            echo "Waiting for manual promotion to testing/stable..."
            # In a real workflow, you might use a GitHub environment
            # with deployment protection rules for this approval.

        - name: Upload to testing (after review)
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: testing
            component: main

        - name: Upload to stable (after further testing)
          uses: rossigee/debian-repo-upload-action@v1
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: stable
            component: main

# Example 6: Error handling (continue on failure)
# .github/workflows/ci.yaml
example_error_handling:
  name: Upload with Error Handling
  on:
    push:
      tags:
        - 'v*'
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build Debian package
          run: dpkg-buildpackage -us -uc

        - name: Try to upload (continue on error)
          uses: rossigee/debian-repo-upload-action@v1
          continue-on-error: true
          with:
            file: ../my-package_*.deb
            base-url: https://debs.example.com
            token: ${{ secrets.DEBIAN_REPO_TOKEN }}
            suite: stable
            component: main
            fail-on-error: false

        - name: Notify on failure
          if: failure()
          run: |
            echo "⚠️ Package upload failed, but continuing..."
            # Send notification, create issue, etc.
